name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify SP-API surface
        shell: pwsh
        run: |
          $source = Get-Content "MainForm.vb" -Raw
          $required = @(
            "/sellers/v1/marketplaceParticipations",
            "/catalog/2022-04-01/items",
            "/products/fees/v0/",
            "/fba/inventory/v1/summaries",
            "/orders/2026-01-01/orders",
            "/reports/2021-06-30/",
            "/feeds/2021-06-30/",
            "/inbound/fba/2024-03-20/",
            "/fba/inbound/v0/shipments/"
          )
          foreach ($value in $required) {
            if (-not $source.Contains($value)) { throw "Missing required SP-API route: $value" }
          }
          $operations = @(
            "catalog","fees","inventory","orders","order","reports","createReport","report","reportDocument",
            "feeds","feed","feedDocument","submitFeed","inboundPlans","inboundPlan","inboundShipment",
            "inboundOperationStatus","prepDetails","createInboundPlan","itemLabels","shipmentLabels","billOfLading"
          )
          $routerMatch = [regex]::Match(
            $source,
            'Private Async Function ExecuteOperationAsync\(operation As String\).*?End Function',
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $routerMatch.Success) { throw "Could not find ExecuteOperationAsync router." }
          $router = $routerMatch.Value

          foreach ($operation in $operations) {
            if (-not $source.Contains('.Id = "' + $operation + '"')) { throw "Missing operation in UI: $operation" }
            if (-not $router.Contains('Case "' + $operation + '"')) { throw "Missing operation in execution router: $operation" }
          }

          $contractChecks = @(
            'SplitValues(S("reportMarketplaceIds"), 25)',
            'SplitValues(S("feedMarketplaceIds"), 25)',
            'SplitValues(S("reportMarketplaceIds"), 10)',
            'SplitValues(S("feedMarketplaceIds"), 10)',
            '/orders/2026-01-01/orders',
            '.Replace("%", "%25").Replace("+", "%2B").Replace(",", "%2C")',
            'REMOVED_LISTING_FEED_TYPE',
            'enableContentEncodingUrlHeader=true',
            'UNIQUE", "BARCODE_2D", "PALLET"',
            'A4_21", "A4_24"'
          )
          foreach ($value in $contractChecks) {
            if (-not $source.Contains($value)) { throw "Missing SP-API contract guard: $value" }
          }

          $safetyChecks = @(
            'SecurityProtocolType.SystemDefault',
            'AutomaticDecompression = DecompressionMethods.GZip Or DecompressionMethods.Deflate',
            'DefaultProxyCredentials = CredentialCache.DefaultCredentials',
            'Private Const PreviewLimit As Integer = 2 * 1024 * 1024',
            'CancellationTokenSource(TimeSpan.FromSeconds(30))',
            'AMBIGUOUS_WRITE_RESULT',
            'Confirm Production write',
            'ValidateContentType(contentType)',
            'ClearWriteConfirmation()',
            'Next: Prepare next page',
            'Open selected'
          )
          foreach ($value in $safetyChecks) {
            if (-not $source.Contains($value)) { throw "Missing reliability/safety guard: $value" }
          }

          $banned = @(
            'ServerCertificateCustomValidationCallback',
            'CertificatePolicy',
            'Thread.Sleep',
            'NODE_TLS_REJECT_UNAUTHORIZED',
            'SecurityProtocolType.Ssl3',
            'strict-ssl=false',
            'amzn1.application-oa2-client.',
            'Atzr|'
          )
          foreach ($value in $banned) {
            if ($source.Contains($value)) { throw "Unsafe or hard-coded pattern found: $value" }
          }

          $project = Get-Content "SP-API.NET.vbproj" -Raw
          if (-not $project.Contains('<TargetFrameworkVersion>v4.7.2</TargetFrameworkVersion>')) {
            throw "Unexpected .NET Framework target."
          }
      - name: Build Debug like Visual Studio F5
        run: msbuild SP-API.NET.sln /m /p:Configuration=Debug /p:Platform="Any CPU"
      - name: Build Release
        run: msbuild SP-API.NET.sln /m /p:Configuration=Release /p:Platform="Any CPU"
      - name: Smoke-start desktop app
        shell: pwsh
        run: |
          $exe = Resolve-Path "bin\Debug\SP-API.NET.exe"
          $env:SP_API_CI_SMOKE = "1"
          $process = Start-Process -FilePath $exe -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path (Split-Path $exe) "smoke-error.txt"
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw "SP-API.NET startup smoke test failed with code $($process.ExitCode)."
          }
