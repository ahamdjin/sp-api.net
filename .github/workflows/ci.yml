name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build VB.NET solution
        run: msbuild SP-API.NET.sln /m /p:Configuration=Release /p:Platform="Any CPU"
